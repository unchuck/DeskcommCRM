# DeskcommCRM — staging SimplesAI em Docker Swarm/Portainer
# Não contém valores secretos. O Portainer injeta as variáveis cadastradas.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  PORT: "3000"
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  SUPABASE_DB_URL: ${SUPABASE_DB_URL}
  INTERNAL_SECRET: ${INTERNAL_SECRET}
  INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET}
  CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY}
  WAHA_BYO_ENCRYPTION_KEY: ${WAHA_BYO_ENCRYPTION_KEY}
  AI_CRED_AES_KEY: ${AI_CRED_AES_KEY}
  WAHA_API_BASE_URL: http://waha:3000
  WAHA_API_KEY: ${WAHA_API_KEY}
  WAHA_WEBHOOK_BASE_URL: http://app:3000
  WAHA_HMAC_SECRET: ${WAHA_HMAC_SECRET}
  WAHA_WEBHOOK_REQUIRE_SIGNATURE: "false"
  UPSTASH_REDIS_REST_URL: http://srh:80
  UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  SENTRY_DSN: off
  NEXT_PUBLIC_APP_URL: https://deskcomm-staging.simplesai.com.br
  DOMAIN: deskcomm-staging.simplesai.com.br

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/melgarafael/deskcommcrm:stable}
    environment: *app-environment
    networks:
      - deskcomm_internal
      - proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.docker.network=simplesai
        - traefik.http.routers.deskcomm-staging.rule=Host(`deskcomm-staging.simplesai.com.br`)
        - traefik.http.routers.deskcomm-staging.entrypoints=websecure
        - traefik.http.routers.deskcomm-staging.tls.certresolver=letsencrypt
        - traefik.http.routers.deskcomm-staging.middlewares=deskcomm-staging-compress
        - traefik.http.services.deskcomm-staging.loadbalancer.server.port=3000
        - traefik.http.middlewares.deskcomm-staging-compress.compress=true
        - traefik.http.routers.deskcomm-staging-http.rule=Host(`deskcomm-staging.simplesai.com.br`)
        - traefik.http.routers.deskcomm-staging-http.entrypoints=web
        - traefik.http.routers.deskcomm-staging-http.middlewares=deskcomm-staging-https
        - traefik.http.routers.deskcomm-staging-http.service=deskcomm-staging
        - traefik.http.middlewares.deskcomm-staging-https.redirectscheme.scheme=https
        - traefik.http.middlewares.deskcomm-staging-https.redirectscheme.permanent=true
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/melgarafael/deskcomm-worker:stable}
    environment:
      <<: *app-environment
      WAHA_API_BASE_URL: http://waha:3000
    networks: [deskcomm_internal]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    environment:
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: http://app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message.any,message.ack,message.edited,message.revoked,session.status,state.change
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - deskcomm_waha_data:/app/.sessions
      - deskcomm_waha_media:/app/.media
    networks: [deskcomm_internal]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
      resources:
        limits:
          memory: 1280M
        reservations:
          memory: 256M
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [deskcomm_internal]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379
    networks: [deskcomm_internal]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 128M
    logging: *default-logging

  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/melgarafael/deskcomm-scheduler:stable}
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    networks: [deskcomm_internal]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 128M
    logging: *default-logging

volumes:
  deskcomm_waha_data:
  deskcomm_waha_media:

networks:
  deskcomm_internal:
    driver: overlay
    attachable: true
  proxy:
    external: true
    name: simplesai
